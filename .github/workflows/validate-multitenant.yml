name: Validate Multitenant API

on:
  push:
    branches:
      - feature/multitenant
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RawSuplementos.csproj

      - name: Build
        run: dotnet build RawSuplementos.csproj --configuration Release --no-restore

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Validate EF model and migrations
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations list --project RawSuplementos.csproj --no-build --configuration Release
          dotnet ef migrations script 0 20260917170000_AgregarMultitenancy --project RawSuplementos.csproj --no-build --configuration Release --output multitenant-migration.sql

      - name: Upload migration SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitenant-migration-sql
          path: multitenant-migration.sql
          if-no-files-found: ignore
